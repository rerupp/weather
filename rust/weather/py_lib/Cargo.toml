[package]
name = "py_weather_lib"
version = "0.8.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "py_weather_lib"
crate-type = ["cdylib"]

[dependencies]
chrono.workspace = true
log.workspace = true
toolslib.workspace = true
weather_lib = { path = "../lib" }

[dependencies.pyo3]
# versuib 0,26 breaks the build because weather_data contains a Box and can't be sync'd across threads
#version = "0.22.0"
version = "0.26"
features = ["chrono"]
